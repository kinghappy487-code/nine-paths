<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Nine Paths</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b120e;color:#fff;font-family:system-ui;touch-action:none}canvas{width:100%;height:100%;display:block}.start{position:fixed;inset:0;background:radial-gradient(circle at 50% 25%,#273b2c,#080d0a 70%);z-index:5;display:flex;align-items:center;justify-content:center;padding:14px}.box{width:min(950px,96vw);max-height:94vh;overflow:auto;border:1px solid #927a4e;border-radius:18px;background:#18201b;padding:16px}.title{text-align:center;font:700 clamp(30px,6vw,58px) Georgia;color:#ffe6a0}.sub{text-align:center;color:#bfcbbf;margin:5px 0 14px}.jobs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.job{min-height:70px;border:1px solid #756548;border-radius:10px;background:#263129;color:white;font-size:14px}.job b{display:block;color:#ffe8a5;font-size:16px}.hud{position:fixed;inset:0;pointer-events:none}.stat{position:absolute;left:10px;top:10px;background:#101712dd;border:1px solid #62563f;border-radius:10px;padding:8px;width:240px;font-size:11px}.bar{height:8px;background:#222;margin:3px 0;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%}.hp{background:#cf4b4b}.xp{background:#e8c65b}.zone{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#101712cc;padding:6px 12px;border-radius:8px}.joy{pointer-events:auto;position:absolute;left:24px;bottom:22px;width:120px;height:120px;border-radius:50%;border:2px solid #ffffff33;background:#ffffff0d}.nub{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:#cdd7d0aa}.actions{pointer-events:auto;position:absolute;right:18px;bottom:18px;display:grid;grid-template-columns:repeat(3,58px);gap:7px}.a{width:58px;height:58px;border-radius:50%;border:2px solid #927a4e;background:#28332c;color:white;font-weight:700}.atk{width:72px;height:72px;background:#8d3030;grid-row:1/3;grid-column:3}.msg{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:18px;font-weight:800;color:#ffe28b;text-shadow:0 2px 4px #000}.rotate{display:none;position:fixed;inset:0;z-index:99;background:#0b120e;align-items:center;justify-content:center;text-align:center;font-size:22px}@media(orientation:portrait){.rotate{display:flex}}@media(max-height:500px){.jobs{grid-template-columns:repeat(6,1fr)}.job{min-height:54px}.box{padding:10px}.title{font-size:30px}.sub{margin:2px 0 8px}}</style></head><body><canvas id="c"></canvas><div class="start" id="start"><div class="box"><div class="title">NINE PATHS</div><div class="sub">가로모드 · Lv.35 · 12직업 · 전투/성장/보스</div><div class="jobs" id="jobs"></div></div></div><div class="hud" id="hud" style="display:none"><div class="stat"><b id="who"></b>　<span id="gold">🪙 0</span><div class="bar"><i class="hp" id="hp"></i></div><span id="ht"></span><div class="bar"><i class="xp" id="xp"></i></div><span id="xt"></span></div><div class="zone" id="zone">초원의 길</div><div class="msg" id="msg"></div><div class="joy" id="joy"><div class="nub" id="nub"></div></div><div class="actions"><button class="a" id="s1">S1</button><button class="a" id="s2">S2</button><button class="a atk" id="atk">공격</button><button class="a" id="s3">S3</button><button class="a" id="pot">🧪</button></div></div><div class="rotate">📱↻<br>가로로 돌려줘</div><script>
const jobs=[['전사','⚔️'],['기사','🛡️'],['궁수','🏹'],['마법사','🔥'],['도적','🗡️'],['성직자','✨'],['광전사','🪓'],['레인저','🌿'],['성기사','☀️'],['무도사','🥊'],['총술사','🔫'],['악마','😈']];
const C=document.querySelector('#c'),X=C.getContext('2d'),J=document.querySelector('#jobs');let W,H,t=0,keys={},joy={x:0,y:0},p=null,es=[],shots=[],fx=[],boss=null,msgT=0;
jobs.forEach((j,i)=>{let b=document.createElement('button');b.className='job';b.innerHTML='<b>'+j[1]+' '+j[0]+'</b>Lv.1부터 시작';b.onclick=()=>start(i);J.appendChild(b)});
function start(i){p={job:i,name:jobs[i][0],icon:jobs[i][1],x:0,y:0,hp:160,max:160,lv:1,xp:0,gold:0,atk:24,cd:[0,0,0],pots:5};document.querySelector('#start').style.display='none';document.querySelector('#hud').style.display='block';spawn(16);say(p.name+'의 길이 시작됐다');}
function spawn(n){for(let i=0;i<n;i++){let a=Math.random()*6.28,r=180+Math.random()*650;es.push({x:Math.cos(a)*r,y:Math.sin(a)*r,hp:45+Math.random()*35,max:80,sp:20+Math.random()*25,type:i%5,hit:0})}}
function resize(){C.width=innerWidth*devicePixelRatio;C.height=innerHeight*devicePixelRatio;W=innerWidth;H=innerHeight;X.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function say(s){let m=document.querySelector('#msg');m.textContent=s;msgT=1.8}
function hit(rad,dmg){let got=0;es.forEach(e=>{let dx=e.x-p.x,dy=e.y-p.y;if(dx*dx+dy*dy<rad*rad){e.hp-=dmg;e.hit=.15;got++}});fx.push({x:p.x,y:p.y,r:rad,a:1});return got}
function attack(){if(!p)return;hit(105,p.atk);say('⚔️ '+p.atk+' 피해')}
function skill(k){if(!p||p.cd[k]>0)return;p.cd[k]=[2.5,5,8][k];let mult=[1.8,2.8,4.2][k],rad=[150,220,310][k];hit(rad,p.atk*mult);say((k==2&&p.lv>=30?'🌟 궁극기! ':'✨ 스킬! ')+Math.round(p.atk*mult)+' 피해')}
document.querySelector('#atk').onclick=attack;['s1','s2','s3'].forEach((id,i)=>document.querySelector('#'+id).onclick=()=>skill(i));document.querySelector('#pot').onclick=()=>{if(p&&p.pots){p.pots--;p.hp=Math.min(p.max,p.hp+80);say('🧪 HP 회복')}};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')attack()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let jb=document.querySelector('#joy'),nub=document.querySelector('#nub');function jm(e){let q=e.touches?e.touches[0]:e,r=jb.getBoundingClientRect(),x=q.clientX-(r.left+r.width/2),y=q.clientY-(r.top+r.height/2),d=Math.hypot(x,y)||1,m=Math.min(38,d);joy.x=x/d*m/38;joy.y=y/d*m/38;nub.style.transform='translate('+joy.x*38+'px,'+joy.y*38+'px)'}jb.addEventListener('touchstart',jm);jb.addEventListener('touchmove',jm);jb.addEventListener('touchend',()=>{joy.x=joy.y=0;nub.style.transform='' });
function update(dt){if(!p)return;let dx=(keys.d?1:0)-(keys.a?1:0)+joy.x,dy=(keys.s?1:0)-(keys.w?1:0)+joy.y,l=Math.hypot(dx,dy)||1;p.x+=dx/l*150*dt;p.y+=dy/l*150*dt;p.cd=p.cd.map(v=>Math.max(0,v-dt));for(let e of es){if(e.hp<=0)continue;let x=p.x-e.x,y=p.y-e.y,d=Math.hypot(x,y)||1;if(d<350){e.x+=x/d*e.sp*dt;e.y+=y/d*e.sp*dt}if(d<32){p.hp-=18*dt;if(p.hp<=0){p.hp=p.max;p.x=p.y=0;say('💀 쓰러졌다… 마을에서 부활')}}e.hit=Math.max(0,e.hit-dt)}let dead=es.filter(e=>e.hp<=0);if(dead.length){for(let e of dead){p.xp+=18;p.gold+=8+Math.floor(Math.random()*10)}es=es.filter(e=>e.hp>0);while(p.xp>=p.lv*55&&p.lv<35){p.xp-=p.lv*55;p.lv++;p.max+=14;p.hp=p.max;p.atk+=4;say('⬆️ LEVEL '+p.lv+(p.lv==30?' · 궁극전직!':''))}if(es.length<8)spawn(10)}msgT-=dt;document.querySelector('#msg').style.opacity=msgT>0?1:0}
function draw(){X.fillStyle='#243b27';X.fillRect(0,0,W,H);if(!p)return;X.save();X.translate(W/2-p.x,H/2-p.y);let g=80;X.strokeStyle='#ffffff0b';for(let x=Math.floor((p.x-W/2)/g)*g;x<p.x+W/2;x+=g){X.beginPath();X.moveTo(x,p.y-H);X.lineTo(x,p.y+H);X.stroke()}for(let y=Math.floor((p.y-H/2)/g)*g;y<p.y+H/2;y+=g){X.beginPath();X.moveTo(p.x-W,y);X.lineTo(p.x+W,y);X.stroke()}es.forEach(e=>{if(e.hp<=0)return;X.fillStyle=e.hit?'#fff':'#9e493d';X.beginPath();X.arc(e.x,e.y,18,0,7);X.fill();X.fillStyle='#111';X.fillRect(e.x-20,e.y-30,40,5);X.fillStyle='#e44';X.fillRect(e.x-20,e.y-30,40*Math.max(0,e.hp/e.max),5);X.fillStyle='#fff';X.font='15px sans-serif';X.textAlign='center';X.fillText(['🐺','👹','🦂','🧟','🦇'][e.type],e.x,e.y+5)});fx.forEach(f=>{X.strokeStyle='#ffe27a';X.globalAlpha=f.a;X.lineWidth=4;X.beginPath();X.arc(f.x,f.y,f.r*(1-f.a*.2),0,7);X.stroke();f.a-=.06});fx=fx.filter(f=>f.a>0);X.globalAlpha=1;X.fillStyle='#f5d27a';X.beginPath();X.arc(p.x,p.y,20,0,7);X.fill();X.font='22px sans-serif';X.fillText(p.icon,p.x,p.y+7);X.restore();document.querySelector('#who').textContent=p.icon+' '+p.name+' Lv.'+p.lv;document.querySelector('#gold').textContent='🪙 '+p.gold;document.querySelector('#hp').style.width=100*p.hp/p.max+'%';document.querySelector('#ht').textContent=Math.ceil(p.hp)+' / '+p.max;document.querySelector('#xp').style.width=100*p.xp/(p.lv*55)+'%';document.querySelector('#xt').textContent='EXP '+p.xp+' / '+p.lv*55;['s1','s2','s3'].forEach((id,i)=>document.querySelector('#'+id).textContent=p.cd[i]>0?p.cd[i].toFixed(1):i==2&&p.lv>=30?'궁극':'S'+(i+1))}
let last=performance.now();function loop(n){let dt=Math.min(.033,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
